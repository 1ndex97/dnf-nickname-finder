name: Build Windows EXE

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest
      - name: Build executable
        run: pyinstaller --noconfirm --windowed --name "DNF Nickname Finder" main.py
      - uses: actions/upload-artifact@v4
        with:
          name: DNF-Nickname-Finder-Windows
          path: dist/DNF Nickname Finder/**
